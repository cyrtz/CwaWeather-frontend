<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>冒險者天氣預報</title>
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            min-height: 100vh;
            color: #FFF;
            overflow-x: hidden;
            padding-bottom: 320px;
            position: relative;
            transition: background 0.3s ease;
            image-rendering: pixelated;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 頂部狀態列 - 像素風格 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 4px solid #333;
        }

        .location-pill {
            display: flex;
            align-items: center;
            gap: 4px;
            color: white;
            font-size: 0.6rem;
            background: #333333;
            padding: 4px 8px;
            border: 2px solid #FFF;
        }

        .update-pill {
            font-size: 0.6rem;
            color: white;
            background: #333333;
            padding: 4px 8px;
            border: 2px solid #FFF;
        }

        .container {
            padding: 20px 16px;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* === 主卡片 - 像素風格 === */
        .hero-card {
            background: none;
            border: none;
            padding: 40px 12px 20px;
            margin-bottom: 12px;
            position: relative;
        }

        .terraria-scene {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 24px;
            width: min(100%, 560px);
            padding: 0 16px;
            z-index: 2;
        }

        .character-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .character-sprite {
            width: 200px;
            height: auto;
            image-rendering: pixelated;
        }

        .speech-bubble {
            position: absolute;
            top: -100px;
            left: calc(100% + 24px);
            width: 320px;
            background: #F0E7D8;
            color: #2C1C12;
            border: 3px solid #3A2A20;
            padding: 16px;
            font-size: 0.65rem;
            line-height: 1.7;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.35);
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: 16px;
            left: -12px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 10px 12px 10px 0;
            border-color: transparent #3A2A20 transparent transparent;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: 16px;
            left: -9px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 10px 12px 10px 0;
            border-color: transparent #F0E7D8 transparent transparent;
        }

        .speech-text {
            text-shadow: none;
            font-size: 1rem;
        }

        .temp-display {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid #FFF;
            padding: 18px 28px;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.35);
            margin: 0 auto 24px;
            max-width: 260px;
        }

        .hero-temp {
            font-size: 3rem;
            color: #FFF;
            line-height: 1;
            padding: 0;
            border: none;
            background: none;
            text-shadow: 4px 4px 0 #000;
        }

        @media (max-width: 520px) {
            .section-title {
                position: static;
                display: inline-block;
                margin: 16px 0 12px 0;
            }

            .scroll-container {
                position: static;
                transform: none;
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                max-height: none;
                padding-right: 0;
                padding-bottom: 10px;
                margin-top: 12px;
            }

            .terraria-scene {
                flex-direction: column;
                gap: 16px;
                width: calc(100% - 24px);
            }

            .character-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
            }

            .speech-bubble {
                position: static;
                width: 100%;
                margin-top: 12px;
            }

            .speech-bubble::before,
            .speech-bubble::after {
                display: none;
            }

            .temp-display {
                width: 100%;
            }
        }

        /* === 快速資訊區 - 像素網格 === */
        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 3px solid #000;
        }

        .advice-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #FFD700;
            padding: 8px;
            border: 2px solid #000;
        }

        .advice-icon {
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .advice-text {
            font-size: 0.5rem;
            color: #000;
            font-weight: bold;
        }

        /* === 未來預報區 - 像素風格 === */
        .section-title {
            position: fixed;
            left: 20px;
            top: calc(50vh - 140px);
            font-size: 0.8rem;
            color: #F0E7D8;
            font-weight: bold;
            background: linear-gradient(135deg, #4A3428 0%, #3A2418 100%);
            padding: 6px 10px;
            border: 3px solid #6B4E3D;
            border-bottom: 4px solid #2A1810;
            border-right: 4px solid #2A1810;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 4px 4px 0 rgba(0, 0, 0, 0.4);
            z-index: 4;
            text-shadow: 1px 1px 0 #000;
            white-space: nowrap;
            width: 150px;
            text-align: center;
        }

        .scroll-container {
            position: fixed;
            left: 20px;
            top: calc(50vh - 90px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            padding-right: 10px;
            scrollbar-width: thin;
            scrollbar-color: #6B4E3D transparent;
            z-index: 3;
        }

        .scroll-container::-webkit-scrollbar {
            width: 6px;
        }

        .scroll-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .scroll-container::-webkit-scrollbar-thumb {
            background: #6B4E3D;
            border-radius: 3px;
        }

        .mini-card {
            width: 150px;
            background: linear-gradient(135deg, #4A3428 0%, #3A2418 100%);
            border: 3px solid #6B4E3D;
            border-bottom: 4px solid #2A1810;
            border-right: 4px solid #2A1810;
            padding: 8px;
            text-align: center;
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 4px 4px 0 rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .mini-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0.03) 4px
            );
            pointer-events: none;
        }

        .mini-time {
            color: #F0E7D8;
            font-size: 0.8rem;
            margin-bottom: 4px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
        }

        .mini-temp {
            font-size: 0.65rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 1px 1px 0 #000;
        }

        /* Loading 畫面 - 泰拉瑞亞風格 */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: background 0.3s ease;
        }
        
        .loading-icon {
            font-size: 2.5rem;
            animation: terrariaFloat 1.2s ease-in-out infinite;
            background: linear-gradient(135deg, #4A3428 0%, #3A2418 100%);
            border: 3px solid #6B4E3D;
            border-bottom: 4px solid #2A1810;
            border-right: 4px solid #2A1810;
            padding: 20px 24px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 6px 6px 0 rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .loading-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.05) 2px,
                rgba(0,0,0,0.05) 4px
            );
            pointer-events: none;
        }
        
        @keyframes terrariaFloat {
            0%, 100% { 
                transform: translateY(0) scale(1);
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 6px 6px 0 rgba(0, 0, 0, 0.4);
            }
            50% { 
                transform: translateY(-16px) scale(1.05);
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 8px 8px 0 rgba(0, 0, 0, 0.3);
            }
        }
        
        .loading-text {
            color: #F0E7D8;
            font-weight: bold;
            margin-top: 24px;
            font-size: 0.65rem;
            background: linear-gradient(135deg, #4A3428 0%, #3A2418 100%);
            padding: 8px 16px;
            border: 3px solid #6B4E3D;
            border-bottom: 4px solid #2A1810;
            border-right: 4px solid #2A1810;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 4px 4px 0 rgba(0, 0, 0, 0.4);
            text-shadow: 1px 1px 0 #000;
            position: relative;
        }

        .loading-text::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0.03) 4px
            );
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="loading" class="loading-screen">
        <div class="loading-icon">☁️</div>
        <p class="loading-text">Loading...</p>
    </div>
    <div class="status-bar">
        <div class="location-pill">📍 Taichung</div>
        <div id="updateTime" class="update-pill">...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">

        <div id="heroCard">
        </div>

    </div>

    <div id="forecastSection" style="display: none;">
        <h3 class="section-title" id="sectionTitle">FORECAST</h3>
        <div class="scroll-container" id="futureForecasts">
        </div>
    </div>

    <div id="characterContainer"></div>

    <script>
        const API_URL = "https://weather-soniduck.zeabur.app/api/weather/kaohsiung";

        // 根據天氣決定背景圖片
        function getWeatherBgImage(weather) {
            if (!weather) return 'overcast.png';
            if (weather.includes("雷")) return 'lightning.png';
            if (weather.includes("雨")) return 'rainy.png';
            if (weather.includes("多雲")) return 'cloudy.png';
            if (weather.includes("陰")) return 'overcast.png';
            if (weather.includes("晴")) return 'sunny.png';
            return 'overcast.png';
        }

        function setWeatherBackground(weather) {
            const img = getWeatherBgImage(weather);
            const url = `url('./assets/${img}')`;
            document.body.style.backgroundImage = url;
            const loading = document.getElementById('loading');
            if (loading) loading.style.backgroundImage = url;
        }

        function getWeatherIcon(weather) {
            if (!weather) return '<span class="material-symbols-outlined" style="font-size:1.8rem;color:#87CEEB;">cloud</span>';
            if (weather.includes("晴")) return '<span class="material-symbols-outlined" style="font-size:1.8rem;color:#FFD700;">wb_sunny</span>';
            if (weather.includes("多雲")) return '<span class="material-symbols-outlined" style="font-size:1.8rem;color:#B0C4DE;">partly_cloudy_day</span>';
            if (weather.includes("陰")) return '<span class="material-symbols-outlined" style="font-size:1.8rem;color:#778899;">cloud</span>';
            if (weather.includes("雨")) return '<span class="material-symbols-outlined" style="font-size:1.8rem;color:#4682B4;">rainy</span>';
            if (weather.includes("雷")) return '<span class="material-symbols-outlined" style="font-size:1.8rem;color:#FFD700;">thunderstorm</span>';
            return '<span class="material-symbols-outlined" style="font-size:1.8rem;color:#87CEEB;">cloud</span>';
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 5 && hour < 11) return "早晨";
            if (hour >= 11 && hour < 14) return "中午";
            if (hour >= 14 && hour < 18) return "下午";
            if (hour >= 18 && hour < 23) return "晚上";
            return "深夜";
        }

        function buildAdventurerSpeech(current, avgTemp) {
            const weatherDesc = current.weather || "未知天氣";
            const maxTempNum = parseInt(current.maxTemp, 10);
            const minTempNum = parseInt(current.minTemp, 10);
            const rainProb = parseInt(current.rain, 10);

            const maxLabel = Number.isNaN(maxTempNum) ? (current.maxTemp || "-") : `${maxTempNum}`;
            const minLabel = Number.isNaN(minTempNum) ? (current.minTemp || "-") : `${minTempNum}`;

            const maxText = maxLabel === "-" ? "未知" : `${maxLabel}°`;
            const minText = minLabel === "-" ? "未知" : `${minLabel}°`;
            const avgText = avgTemp === "--" ? "未知" : `${avgTemp}°`;

            let guidance = "氣候和煦，補滿水壺就能啟程。";

            if (!Number.isNaN(rainProb) && rainProb >= 50) {
                guidance = "雨雲密佈，帶上雨具與防水斗篷，路滑要小心。";
            } else if (!Number.isNaN(rainProb) && rainProb >= 30) {
                guidance = "天空陰晴不定，備妥雨傘以免措手不及。";
            } else if (weatherDesc.includes("雷")) {
                guidance = "雷鳴轟響，避開高地與空曠處，尋找遮蔽。";
            } else if (!Number.isNaN(maxTempNum) && maxTempNum >= 30) {
                guidance = "陽光毒辣，塗好防曬藥水並多補水。";
            } else if (!Number.isNaN(minTempNum) && minTempNum <= 18) {
                guidance = "夜風偏涼，披上外套才不會失溫。";
            }

            return `冒險者，今日是${weatherDesc}！<br>平均氣溫約 ${avgText}，最高 ${maxText}，最低 ${minText}。<br>${guidance}整裝再出發！`;
        }

        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            // 1. 渲染 Hero Card (主畫面)
            const maxTempNum = parseInt(current.maxTemp, 10);
            const minTempNum = parseInt(current.minTemp, 10);

            let avgTemp = "--";
            if (!Number.isNaN(maxTempNum) && !Number.isNaN(minTempNum)) {
                avgTemp = Math.round((maxTempNum + minTempNum) / 2);
            } else if (!Number.isNaN(maxTempNum)) {
                avgTemp = maxTempNum;
            } else if (!Number.isNaN(minTempNum)) {
                avgTemp = minTempNum;
            }

            const avgTempDisplay = avgTemp === "--" ? "--" : `${avgTemp}°`;
            const speechMessage = buildAdventurerSpeech(current, avgTemp);

            setWeatherBackground(current.weather);

            // 更新預報區標題顯示當前天氣
            const weatherStatus = current.weather || '未知';
            document.getElementById('sectionTitle').textContent = `${weatherStatus}`;

            document.getElementById('heroCard').innerHTML = `
                <div class="hero-card">
                    <div class="temp-display">
                        <div class="hero-temp">${avgTempDisplay}</div>
                    </div>
                </div>
            `;

            document.getElementById('characterContainer').innerHTML = `
                <div class="terraria-scene">
                    <div class="character-wrapper">
                        <img src="./assets/character.png" alt="Terraria adventurer" class="character-sprite">
                        <div class="speech-bubble">
                            <p class="speech-text">${speechMessage}</p>
                        </div>
                    </div>
                </div>
            `;

            // 2. 渲染稍後預報 (包含明天判斷)
            const scrollContainer = document.getElementById('futureForecasts');
            scrollContainer.innerHTML = '';

            // 抓今天的日期數字 (例如 24)
            const todayDate = new Date().getDate();

            others.forEach(f => {
                let p = getTimePeriod(f.startTime);

                // 判斷該預報的日期是否跟今天不同，不同就是明天
                const fDate = new Date(f.startTime);
                if (fDate.getDate() !== todayDate) {
                    p = "明天" + p;
                }

                scrollContainer.innerHTML += `
                            <div class="mini-card">
                                <div class="mini-time">${p}</div>
                                <div style="margin:8px 0;">${getWeatherIcon(f.weather)}</div>
                                <div class="mini-temp">${f.minTemp}°-${f.maxTemp}°</div>
                                <div style="font-size:0.55rem; color:#87CEEB; margin-top:4px; text-shadow: 1px 1px 0 #000;">💧${f.rain}%</div>
                            </div>
                        `;
            });

            // 3. 右上角顯示今日日期
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayIndex = now.getDay();
            const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

            document.getElementById('updateTime').textContent = `${month}月${date}日 ${days[dayIndex]}`;
        }

        async function fetchWeather() {
            try {
                // 1. 定義「最低等待時間」：1500 毫秒 (1.5秒)
                const delayPromise = new Promise(resolve => setTimeout(resolve, 1500));

                // 2. 定義「抓取資料」的工作
                const fetchPromise = fetch(API_URL).then(res => res.json());

                // 3. Promise.all 會等待「兩個都完成」才會往下走
                // result 陣列裡，第一個是 delay 的結果(沒用到)，第二個是 api 的 json 資料
                const [_, json] = await Promise.all([delayPromise, fetchPromise]);

                if (json.success) {
                    renderWeather(json.data);

                    // 資料處理好後，隱藏 Loading，顯示主畫面
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    document.getElementById('forecastSection').style.display = 'block';
                } else {
                    throw new Error("API Error");
                }
            } catch (e) {
                console.error(e);
                alert("天氣資料讀取失敗，狸克把網路線咬斷了！");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchWeather();
        });
    </script>
</body>

</html>
